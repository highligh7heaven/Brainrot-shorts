name: Voice Samples

# Sends 7 short narrator voice samples to Telegram so you can pick one by ear
# (costs under $0.01). Start it from the GitHub app: Actions -> Voice Samples -> Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  samples:
    name: Make voice samples
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BRAINROT_OUT: ${{ github.workspace }}/output
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -q -r requirements.txt

      - name: Make the samples and send them
        run: python -m brainrot.voice_samples
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
