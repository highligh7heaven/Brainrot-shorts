name: Brainrot Shorts

# Makes one finished Short on GitHub's computers and sends it to your
# Telegram bot. Start it from the GitHub app: Actions -> Brainrot Shorts ->
# Run workflow. The automatic 3-a-day schedule is added once a manual run works.
on:
  workflow_dispatch:
    inputs:
      idea:
        description: "Your own idea in a few words (leave blank to use a trend)"
        required: false
        default: ""
      test:
        description: "Test run: built-in story, nothing sent to Telegram"
        type: boolean
        default: false
      narrator:
        description: "Narrator voice 1-7 from the voice samples (blank = pick at random)"
        required: false
        default: ""

concurrency:
  group: brainrot
  cancel-in-progress: false

permissions:
  contents: write   # lets a test run save its preview to the "previews" branch

jobs:
  make:
    name: Make a Short
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BRAINROT_OUT: ${{ github.workspace }}/output
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install video tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q -r requirements.txt

      - name: Make the Short
        run: python -m brainrot.main ${{ inputs.test && '--sample' || '' }}
        env:
          IDEA: ${{ inputs.idea }}
          NARRATOR: ${{ inputs.narrator }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Keep a copy of the files for 3 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_number }}
          path: output/
          retention-days: 3
          if-no-files-found: ignore

      - name: Save the test video to the previews branch
        if: inputs.test
        run: |
          video=$(ls output/*/short.mp4 | head -1)
          mkdir -p /tmp/preview && cp "$video" /tmp/preview/preview.mp4
          cp "$(dirname "$video")/post.txt" "$(dirname "$video")/story.json" /tmp/preview/
          cd /tmp/preview
          git init -q -b previews
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Test preview from run ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" previews
