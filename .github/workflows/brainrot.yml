name: Brainrot Shorts

# Makes one finished Short on GitHub's computers and sends it to your
# Telegram bot.
#
# Automatic: GitHub checks every hour and makes a video at your daily times.
# Change them in Settings -> Secrets and variables -> Actions -> Variables:
#   POST_TIMES  e.g. "8am, 1pm, 7pm"        (default)
#   TIMEZONE    e.g. "America/Vancouver"    (default)
# By hand: GitHub app -> Actions -> Brainrot Shorts -> Run workflow.
on:
  schedule:
    - cron: "17 * * * *"   # every hour at :17; the check below decides
  workflow_dispatch:
    inputs:
      idea:
        description: "Your own idea in a few words (starts a new series; blank = continue or use a trend)"
        required: false
        default: ""
      test:
        description: "Test run: built-in story, nothing sent to Telegram"
        type: boolean
        default: false
      narrator:
        description: "Narrator voice 1-7 from the voice samples (blank = pick at random)"
        required: false
        default: ""

concurrency:
  group: brainrot
  cancel-in-progress: false

permissions:
  contents: write   # saves the robot's memory and test previews

jobs:
  check:
    name: Is it time for a video?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.when.outputs.run }}
      slot: ${{ steps.when.outputs.slot }}
    env:
      PYTHONTZPATH: ""   # use the up-to-date tzdata package for time zones
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'schedule'

      - uses: actions/setup-python@v5
        if: github.event_name == 'schedule'
        with:
          python-version: "3.12"

      - name: Check the time
        id: when
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Started by hand, so making a video now."
          else
            pip install -q -U tzdata
            python -m brainrot.schedule
          fi
        env:
          POST_TIMES: ${{ vars.POST_TIMES }}
          TIMEZONE: ${{ vars.TIMEZONE }}

  make:
    name: Make a Short
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BRAINROT_OUT: ${{ github.workspace }}/output
      PYTHONTZPATH: ""
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install video tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q -r requirements.txt

      - name: Make the Short
        run: python -m brainrot.main ${{ inputs.test && '--sample' || '' }}
        env:
          IDEA: ${{ inputs.idea }}
          NARRATOR: ${{ inputs.narrator }}
          SLOT: ${{ needs.check.outputs.slot }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save the robot's memory (series and past stories)
        if: success() && !inputs.test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          if git diff --cached --quiet; then echo "Nothing new to remember."; exit 0; fi
          git commit -q -m "Remember run ${{ github.run_number }}"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep 5
          done
          echo "Couldn't save the memory" && exit 1

      - name: Keep a copy of the files for 3 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_number }}
          path: output/
          retention-days: 3
          if-no-files-found: ignore

      - name: Save the test video to the previews branch
        if: inputs.test
        run: |
          video=$(ls output/*/short.mp4 | head -1)
          mkdir -p /tmp/preview && cp "$video" /tmp/preview/preview.mp4
          cp "$(dirname "$video")/post.txt" "$(dirname "$video")/story.json" /tmp/preview/
          cd /tmp/preview
          git init -q -b previews
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Test preview from run ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" previews
