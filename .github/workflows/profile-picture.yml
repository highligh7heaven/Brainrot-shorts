name: Profile Picture

# Draws 3 channel profile picture options (about $0.10) and sends them to
# Telegram. Start it from the GitHub app: Actions -> Profile Picture -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      idea:
        description: "What the picture should show (leave blank for the strawberry queen)"
        required: false
        default: ""

permissions:
  contents: write   # saves a copy to the "previews" branch

jobs:
  draw:
    name: Draw profile pictures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BRAINROT_OUT: ${{ github.workspace }}/output
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -q -r requirements.txt

      - name: Draw the options
        run: python -m brainrot.logo "$IDEA"
        env:
          IDEA: ${{ inputs.idea }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save a copy to the previews branch
        run: |
          mkdir -p /tmp/logos && cp output/logos/*.png /tmp/logos/
          cd /tmp/logos
          git init -q -b previews-logos
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Profile picture options from run ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" previews-logos:previews-logos
